<svg xmlns="http://www.w3.org/2000/svg" width="940" height="240" viewBox="0 0 940 240" role="img" aria-labelledby="title desc">
  <title id="title">Rohan's GitHub activity constellation</title>
  <desc id="desc">A preview of the animated activity constellation. The GitHub workflow will replace it with live contribution data.</desc>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141210"/><stop offset=".55" stop-color="#24201c"/><stop offset="1" stop-color="#181512"/></linearGradient><linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8a6b3f"/><stop offset=".5" stop-color="#fff2bf"/><stop offset="1" stop-color="#b99355"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.label{font:600 17px system-ui,sans-serif;fill:#f4f1eb}.meta{font:12px system-ui,sans-serif;fill:#a99e91}.star{fill:#d6b16d;filter:url(#glow);animation:twinkle 3s ease-in-out infinite alternate}.trail{stroke-dasharray:9 18;animation:travel 7s linear infinite}@keyframes travel{to{stroke-dashoffset:-270}}@keyframes twinkle{to{opacity:.5}}@media(prefers-reduced-motion:reduce){.star,.trail{animation:none}}</style>
  <rect width="940" height="240" rx="18" fill="url(#sky)"/><text x="32" y="34" class="label">Activity constellation</text><text x="908" y="34" text-anchor="end" class="meta">updates automatically every day</text>
  <path d="M70 165 L145 95 L225 142 L310 70 L390 130 L478 87 L565 154 L650 72 L740 126 L860 82" fill="none" stroke="#8a6b3f" opacity=".25"/><path class="trail" d="M70 165 L145 95 L225 142 L310 70 L390 130 L478 87 L565 154 L650 72 L740 126 L860 82" fill="none" stroke="url(#trail)" stroke-width="2.3" stroke-linecap="round"/>
  <g><circle class="star" cx="70" cy="165" r="4"/><circle class="star" cx="145" cy="95" r="5"/><circle class="star" cx="225" cy="142" r="3.5"/><circle class="star" cx="310" cy="70" r="5.5"/><circle class="star" cx="390" cy="130" r="4"/><circle class="star" cx="478" cy="87" r="5"/><circle class="star" cx="565" cy="154" r="3.5"/><circle class="star" cx="650" cy="72" r="5.5"/><circle class="star" cx="740" cy="126" r="4"/><circle class="star" cx="860" cy="82" r="5"/></g>
  <text x="32" y="220" class="meta">Every active day adds another star.</text>
</svg>
